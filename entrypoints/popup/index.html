<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slopless</title>
    <style>
      body { width: 300px; padding: 14px; display: grid; gap: 12px; }
      header { display: flex; justify-content: space-between; align-items: baseline; }
      p { margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Slopless</h1>
      <a href="#" id="open-options" class="small">Settings</a>
    </header>

    <section>
      <h2>Mode</h2>
      <div class="seg" id="mode" role="group" aria-label="Mode">
        <button data-v="off">Off</button>
        <button data-v="flag">Flag</button>
        <button data-v="hide">Hide</button>
      </div>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><b id="s-scanned">0</b><span class="small muted">checked today</span></div>
        <div class="stat"><b id="s-flagged">0</b><span class="small muted">likely AI</span></div>
        <div class="stat"><b id="s-ms">–</b><span class="small muted">ms / post</span></div>
      </div>
    </section>

    <p class="small" id="engine"><span class="dot"></span>Checking model…</p>
    <p class="small muted">Runs on this device. Nothing is sent anywhere.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
