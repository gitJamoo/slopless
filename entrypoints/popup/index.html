<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slopless</title>
    <style>
      body { width: 320px; padding: 14px; display: grid; gap: 12px; }
      header { display: flex; justify-content: space-between; align-items: baseline; }
      p { margin: 6px 0 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Slopless</h1>
      <a href="#" id="open-options" class="small">Settings</a>
    </header>

    <section>
      <h2>Mode</h2>
      <div class="seg" id="mode" role="group" aria-label="Mode">
        <button data-v="off">Off</button>
        <button data-v="flag">Flag</button>
        <button data-v="hide">Hide</button>
        <button data-v="rewrite">Rewrite</button>
      </div>
    </section>

    <section>
      <h2>Detector</h2>
      <div class="seg" id="detector" role="group" aria-label="Detector">
        <button data-v="local" title="Open Pangram model on this device. Free, private.">On-device</button>
        <button data-v="hybrid" title="On-device first; Pangram API only when unsure.">Hybrid</button>
        <button data-v="pangram" title="Pangram API for every post. Most accurate; costs credits.">Pangram</button>
      </div>
      <p class="small muted" id="detector-note"></p>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><b id="s-scanned">0</b><span class="small muted">scanned today</span></div>
        <div class="stat"><b id="s-flagged">0</b><span class="small muted">likely AI</span></div>
        <div class="stat"><b id="s-usd">$0.00</b><span class="small muted">Pangram spend</span></div>
      </div>
    </section>

    <p class="small" id="engine"><span class="dot"></span>Checking engine…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
